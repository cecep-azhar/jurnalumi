services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jurnalumi
      POSTGRES_PASSWORD: password
      POSTGRES_DB: jurnalumi_dev
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025" # SMTP server
      - "8025:8025" # Web UI

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      - DB_DSN=postgres://jurnalumi:password@db:5432/jurnalumi_dev?sslmode=disable
      - APP_ENV=development
      - PORT=8080
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    depends_on:
      - db
      - mailhog

volumes:
  db_data: